bot:
  abi_migration_branches:
  - rc
build_platform:
  linux_ppc64le: linux_aarch64
  osx_64: osx_arm64
conda_build:
  error_overlinking: true
conda_build_tool: rattler-build
conda_forge_output_validation: true
conda_install_tool: pixi
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_aarch64: default
  osx_arm64: default
test: all
workflow_settings:
  build_workspace_dir:
  - os: win
    value: C:/bld
